name: CI — build, contracts, tests and security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sara-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Web and scene contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Configure Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install from lockfile
        run: npm ci
      - name: Lint web
        run: npm run lint
      - name: Typecheck web
        run: npm run typecheck
      - name: Test scene contracts (including hostile input)
        run: npm --workspace @sara/contracts test
      - name: Build web
        run: npm run build
      - name: Smoke-test built web
        run: npm run test:web
      - name: Check format of changed frontend/contract files
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/check_changed_format.py web
      - name: Audit npm dependencies (high and critical)
        run: npm audit --audit-level=high

  backend:
    name: Python API and security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install API and lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/api/requirements.txt "ruff>=0.14,<1"
      - name: Check dependency consistency
        run: python -m pip check
      - name: Lint Python
        run: ruff check apps/api scripts --select E4,E7,E9,F
      - name: Check format of changed Python files
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/check_changed_format.py python
      - name: Compile Python
        run: python -m compileall -q apps/api scripts
      - name: Test API and schema validation
        run: python -m unittest discover -s apps/api -p "test_*.py" -v
      - name: Reject checked-in credentials and private key material
        run: |
          python scripts/scan_secrets.py --self-test
          python scripts/scan_secrets.py

  dependency-review:
    name: Dependency review (PR only)
    if: github.event_name == 'pull_request' && vars.DEPENDENCY_REVIEW_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Reject new high/critical advisories
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
